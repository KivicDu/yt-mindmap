name: yt-mindmap

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ytmindmap
      POSTGRES_PASSWORD: ytmindmap
      POSTGRES_DB: ytmindmap
    volumes:
      - mindmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytmindmap -d ytmindmap"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # Run pending migrations before serving; a fresh volume has no tables.
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # The browser talks to the backend directly, so allow the nginx origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://ytmindmap:ytmindmap@db:5432/ytmindmap
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-http://localhost:8001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Email delivery. Keep EMAIL_BACKEND=log to write links to the container
      # log, or set smtp + the SMTP_* values below to send real mail.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-yt-mindmap <no-reply@ytmindmap.local>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      DEBUG_EMAIL_LINKS: ${DEBUG_EMAIL_LINKS:-false}
      # Cookies must be Secure when the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Abuse protection (in-memory; matches the single-worker backend).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-240}
      AI_DAILY_QUOTA_PER_USER: ${AI_DAILY_QUOTA_PER_USER:-5000}
      AI_DAILY_QUOTA_ANONYMOUS: ${AI_DAILY_QUOTA_ANONYMOUS:-1000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "8001:8001"
    volumes:
      - mindmap-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8001}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-contact@ytmindmap.local}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional local inbox for testing real SMTP delivery:
  #   docker compose --profile mailpit up -d
  # then set EMAIL_BACKEND=smtp, SMTP_HOST=mailpit, SMTP_PORT=1025,
  # SMTP_STARTTLS=false and open http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mailpit"]
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  mindmap-data:
  mindmap-db:
