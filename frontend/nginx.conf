server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    set $share_slug "";
    ssi on;
    ssi_types text/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    set $content_security_policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://i.ytimg.com https://*.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_API_ORIGIN} https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com";
    add_header Content-Security-Policy $content_security_policy always;

    # Hashed filenames never change, so cache them aggressively. Repeating the
    # security headers here is required: add_header stops inheritance.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $content_security_policy always;
        try_files $uri =404;
    }

    location = /__share_meta {
        internal;
        proxy_pass http://backend:8001/api/share/meta;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/s/([A-Za-z0-9-]+)$ {
        set $share_slug $1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $content_security_policy always;
        try_files $uri $uri/ /index.html;
    }

    # Private, account, and unlisted shared routes must not appear in search results.
    location ~* ^/(app|dashboard|login|register|verify-email|confirm-email-change|forgot-password|reset-password)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $content_security_policy always;
        try_files $uri $uri/ /index.html;
    }

    # Single-page app: unknown paths fall back to the React entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
