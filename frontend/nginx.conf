# Share links get their own social metadata, and private routes stay out of
# search results. Both rules key on the original request URI: the internal
# redirect to index.html rewrites $uri, so a location-scoped variable would be
# lost before SSI runs.
map $request_uri $share_slug {
    default "";
    ~^/s/(?<share_slug_value>[A-Za-z0-9-]+)$ $share_slug_value;
}

map $request_uri $robots_tag {
    default "";
    ~^/s/[A-Za-z0-9-]+$ "noindex, nofollow";
    ~*^/(app|dashboard|login|register|verify-email|confirm-email-change|forgot-password|reset-password)(/|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    ssi on;
    # Docker's embedded DNS. The API is proxied through a variable so nginx
    # resolves it per request instead of at startup, which keeps `nginx -t`
    # working when the backend container is not running.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $share_meta_api http://backend:8001;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag $robots_tag always;
    set $content_security_policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://i.ytimg.com https://*.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_API_ORIGIN} https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com";
    add_header Content-Security-Policy $content_security_policy always;

    # Hashed filenames never change, so cache them aggressively. Repeating the
    # security headers here is required: add_header stops inheritance.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $content_security_policy always;
        try_files $uri =404;
    }

    location = /__share_meta {
        internal;
        proxy_pass $share_meta_api/api/share/meta$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to the React entry point. The
    # share and private-route behaviour lives in the maps above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
